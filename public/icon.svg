<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle / Android Safe Area -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="4" />

  <!-- Bicycle Icon Art fully within safe zone (80% box: 51px to 461px) -->
  <g filter="url(#glow)" transform="translate(0, 10)">
    <!-- Back Wheel -->
    <circle cx="160" cy="310" r="64" fill="none" stroke="url(#accentGrad)" stroke-width="18" />
    <circle cx="160" cy="310" r="14" fill="#34d399" />
    <!-- Front Wheel -->
    <circle cx="352" cy="310" r="64" fill="none" stroke="url(#accentGrad)" stroke-width="18" />
    <circle cx="352" cy="310" r="14" fill="#34d399" />

    <!-- Bicycle Frame Lines -->
    <!-- Bottom bracket to rear hub -->
    <line x1="160" y1="310" x2="235" y2="310" stroke="#f1f5f9" stroke-width="15" stroke-linecap="round" />
    <!-- Rear hub to seat post -->
    <line x1="160" y1="310" x2="215" y2="215" stroke="#f1f5f9" stroke-width="15" stroke-linecap="round" />
    <!-- Bottom bracket to seat post -->
    <line x1="235" y1="310" x2="215" y2="215" stroke="#f1f5f9" stroke-width="15" stroke-linecap="round" />
    <!-- Seat post extension and Saddle -->
    <line x1="215" y1="215" x2="205" y2="185" stroke="#f1f5f9" stroke-width="15" stroke-linecap="round" />
    <path d="M 180 185 L 235 185 Q 240 185 240 190 Q 235 195 220 195 Z" fill="#34d399" />

    <!-- Bottom bracket to head tube (down tube) -->
    <line x1="235" y1="310" x2="315" y2="215" stroke="#f1f5f9" stroke-width="15" stroke-linecap="round" />
    <!-- Seat post to head tube (top tube) -->
    <line x1="215" y1="215" x2="315" y2="215" stroke="#f1f5f9" stroke-width="15" stroke-linecap="round" />

    <!-- Front Fork (head tube to front wheel hub) -->
    <line x1="328" y1="185" x2="352" y2="310" stroke="#f1f5f9" stroke-width="15" stroke-linecap="round" />
    <!-- Handlebars stem and drop/flat bar -->
    <line x1="328" y1="185" x2="335" y2="165" stroke="#f1f5f9" stroke-width="15" stroke-linecap="round" />
    <path d="M 315 165 L 345 165 Q 360 165 358 180 Q 356 190 348 190" fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Speed / GPS Signal Accent Waves -->
  <path d="M 220 135 Q 256 115 292 135" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  <path d="M 235 110 Q 256 95 277 110" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.6" />
</svg>
